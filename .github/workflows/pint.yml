name: pint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
      - run: composer install --prefer-dist --no-interaction --no-suggest
      - run: vendor/bin/pint --test
